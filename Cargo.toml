[package]
name = "ferrite-aurora"
version = "0.1.2"
description = "NOAA space weather and aurora forecasts in a Ferrite dashboard."
license = "Apache-2.0"
authors = ["Ryan Wetzstein"]
repository = "https://github.com/rwetz/ferrite-aurora"
readme = "README.md"
edition = "2024"
rust-version = "1.92"

[dependencies]
futures = "0.3"
chrono = "0.4"
serde_json = "1"
ureq = "3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
ferrite-design = { git = "https://github.com/rwetz/ferrite-design", rev = "4ddbb40bf34e219278784fdcb4e5d0e4e76f4cdc" }
# Must match ferrite-design exactly (PITFALLS §1).
gpui = { package = "gpui-pre", version = "=0.3.8" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8" }

# gpui is sluggish unoptimised; optimise dependencies even in dev builds.
[profile.dev.package."*"]
opt-level = 3

[target."cfg(windows)".build-dependencies]
winresource = "0.1.31"
